<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT - Array Methods</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JS - Array Methods - ES6</h1>
    <main>
        <section id="output"></section>

        <script>
            
            let texto = " ";

            //Métodos de arrays
            let numeros = [1, 2, 3 , 4, 5];

            texto += `<p> Números: ${numeros}`;

            //Criar um duplicado

            let duplos = [];

            for (let i = 0; i < numeros.length; i++){ //Código com abordagem imperativa
                duplos.push(numeros[i] * 2)
            }
            
            texto = `<hr></p>Duplos: ${duplos};`

            //Criar array de triplos

            let triplos = [];

            for (const num of numeros) {
                triplos.push(num * 3);
            }

            texto = `<hr></p>Triplos: ${triplos};`

            //Criar quadruplos

            let quadruplos = [];
            /* numeros.forEach(function(num){
                quadruplos.push(num * 4);
            }) */

            numeros.forEach(num => quadruplos.push(num * 4)); //Código com abordagem declarativa

            //Imperativa => Orientada a objetos (mais complexas); Declarativa => Orientada a funções (mais simples);
            texto = `<hr></p>Quadruplos: ${quadruplos};`

            //Alguns métodos introduzidos em ES6, métodos mais declarativos

            //Não fazem mutação à array original

            //callbackFn - Uma função a executar para cada elemento no array. Seu valor de retorno é adicionado como um único elemento no novo array. A função é chamada com os seguintes argumento

            //Map => Cria uma nova array para transformar um dado set de values para outro 
            let potencias = numeros.map(n => n**2);
            console.log(potencias);
            console.log(numeros);

            //Filter = Cria uma *cópia* da array que filtra-a para os elementos especificamente declarados numa dada função
            let cervejas = [ 
                'Sagres',
                'Super Bock',
                'Guinness',
                'Heineken',
                'Brahma',
                'Fransciskanner',//É prático deixar a trailing comma para que não nos esqueçamos dela na linha seguinte

            ] 
            console.log(cervejas);

            //Lista cervejas com mais de 6 letras

            let cervejasComMaisDe6Letras = cervejas.filter(cerveja => cerveja.length > 6);

            console.log(cervejasComMaisDe6Letras);
            console.log(cervejas);

            //Eliminar um item de uma array
            //Cervejas sem Sagres

            let cervejasSemSagres = cervejas.filter (cerveja => cerveja !== 'Sagres');
            console.log(cervejasSemSagres);
            console.log(cervejas);

            //.map(), 
            //.filter(), 
            //.find() (retorna o primeiro elemento que cumpra com um determinado parâmetro), 
            //.every() (verifica se todos os elementos cumprem com os parâmetros indicados), 
            //.some() (verifca se um elemento cumpra com determinado parâmetro), 
            //.reduce() (pega em todos os valores numa array e combina numa só)

            let output = document.getElementById('output');
            output.innerHTML = texto;
        </script>
    </main>
</body>
</html>
