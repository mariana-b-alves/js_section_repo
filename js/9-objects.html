<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT - Objects</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JS - Objects</h1>
    <main>
        <section id="output"></section>

        <script>
            
            let texto = " ";

            //Criação de objetos
            //Object Literal
            let rooms = 500;
            let
            

            const hotel = {
                name: 'Ritz',
                rooms: 200,
                booked: 75,
                pool: true,
                typeOfRooms: ['suite', 'single', 'twins'],
                check: function(){ //Não se deve fazer arrow function com objetos
                    return this.rooms - this.booked; //This -> fazer referência à instância do objeto

                    //Se retirar o this, em vez de ir buscar ao objeto em causa, "salta para fora" e vai buscar às variáveis / ao global;
                }
            }

            console.log(hotel.name);
            console.log(hotel.check());
            

            //NOTA: Propriedades têm parênteses, métodos não

            let output = document.getElementById('output');
            output.innerHTML = texto;
        </script>
    </main>
</body>
</html>
