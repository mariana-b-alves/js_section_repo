<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT - Intro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JS - DADOS - Strings</h1>
    <main>
        <section id="output"></section>

        <script>
            /*String - Conjunto de caracteres*/
            let nome = "João";
            let apelido = 'Gonçalves</b>';
            let nacionalidade = `Portuguesa`;

            /*ES6 - Introduzido os "backticks", template literals*/

            /*ES5*/

            let nomeCompleto = nome + " " + apelido;
            /* let frase = "<h3> O Sr. " + nome + " " + apelido + " " + " tem a nacionalidade " + nacionalidade + ".<h3>" */

            let frase = "<h3> O Sr.";
                frase += nome + " ";
                frase += apelido + " tem a nacionalidade ";
                frase += nacionalidade + ".</h3>"
                
            /*ES6*/
            let outraFrase = `
                <h2>O Sr. ${nome} ${apelido}</h2>
                <h2> Tem a nacionalidade ${nacionalidade}.</h2>
                <hr>
            `;

            let texto = `
            <h1> ${'Olá, ' + nomeCompleto } </h1>
            <p> Número de caracteres: ${nomeCompleto.length} </p>
            <p> ${nomeCompleto.toUpperCase()} </p>
            <p> ${nomeCompleto.toLowerCase()} </p>
            <p> ${nome.charAt(2)}</p>
            <p> ${nomeCompleto.indexOf('ã')}
            <p> ${nomeCompleto.search('x')}
            `;

            /*Com backticks dá para escrever em múltiplas linhas*/

            // escrever dentro da section output
            let output = document.getElementById('output');
            output.innerHTML = texto;
        </script>
    </main>
</body>
