<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT - Estruturas de Decisão</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JS - Booleanos - If / else- Switch</h1>
    <main>
        <section id="output"></section>

        <script>
            let texto = "";
            /*Valores booleanos, utilizados em estruturas de decisão*/
            //Operadores de Comparação
            //<, >, <=, >=, ==, ===; =/=

            //IF / ELSE

            //Operadores binários

            /* let saldo = 700; */

            /*  if (saldo > 700) { //se verdadeiro
                texto = "Comprar uma boa prenda." */

            if (saldo > 700) { //se verdadeiro
                texto = "Comprar uma boa prenda."
            } else {
                texto = "Comprar uma prenda de treta."
            }

            //Operadores ternários
            //(condição) ? se verdadeiro : se falsa
            /* (saldo > 700) ? texto="Boa prenda." : texto="Prenda de treta."; */

            //NOTA: Se só tivermos uma condição, podemos omitir as chavetas; por motivos de hábito, NÃO se deve fazê-lo.

           /*  let saldo = 500;

            if (saldo > 700) { //se verdadeiro
                texto = "Comprar uma boa prenda."
            } else if (saldo > 500){
                texto = "Comprar uma prenda de treta."
            } else{
                texto = "Vai mas é trabalhar..."
            } */

            let saldo = 500;
            let periodo = "Dia do pai"

            if ((saldo > 700) && (periodo == "Dia do Pai")){ //== -> Comparação; && -> E (And)
                texto = "Comprar uma boa prenda."
            } 

            
            if ((saldo > 700) || (periodo == "Dia do Pai")){ //|| -> Ou (Or)
                texto = "Comprar uma boa prenda."
            } 

            /*Álgebra Booleana
                V && V = V
                V && F = F
                F && F = F

                F || F = F
                F || V = F
                V || V = V
            */

            /*SWITCH*/
            let lingua = prompt("Qual a língua?");

            alert ("asdfghjkl");

            switch (lingua) {
                case 'pt':
                    texto = "Bom dia."
                    break;

                case 'en':
                    texto = "Good Morning."
                    break;

                case 'fr':
                    texto = "Bonjour."
                    break;

                case 'en':
                    texto = "Buenos Dias."
                    break;

                default:
                    texto = "Lingua desconhecida."
                    break;

            }
            
            
           
           
            // escrever dentro da section output
            let output = document.getElementById('output');
            output.innerHTML = lingua
        </script>
    </main>
</body>
</html>
