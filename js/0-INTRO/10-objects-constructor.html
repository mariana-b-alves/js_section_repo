<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT - Objects</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JS - Objects</h1>
    <main>
        <section id="output"></section>

        <script>
            
            let texto = " ";

            function Hotel(nome, quartos, reservas){
                //propriedades do objeto
                this.name = nome;
                this.rooms = quartos;
                this.bookings = reservas;

                //Métodos
                this.check = function(){
                    return this.rooms - this.bookings;
                }     
            }

                let ritz = new Hotel ('Ritz', 300,  45);
                let vip = new Hotel ('VIP Executive', 250,  75);
                let evolution = new Hotel ('Evolution', 350,  95);

                let hotels = [ritz, vip, evolution];

                for (const hotel of hotels){
                    texto += `
                    <hr>
                    <h2>Nome do Hotel: ${hotel.name}</h2>
                    <h3>Quartos: ${hotel.rooms}</h3>
                    <h3>Reservas: ${hotel.check()}</h3>
                    <hr>
                `;
                }

          
            


            let output = document.getElementById('output');
            output.innerHTML = texto;
        </script>
    </main>
</body>
</html>
